name: Secret Scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.18.4

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (MIT license, last free version)
        run: |
          curl -sSLf -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Scan history reachable from HEAD for secrets
        run: gitleaks detect --redact --no-banner --verbose --log-opts="HEAD"
